<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)" />
    <!-- si no carga un archivo de la app (versión vieja en caché tras un deploy): fuera el service worker y recargar, una vez -->
    <script>addEventListener("error",function(e){var t=e.target,u=t&&(t.src||t.href)||"";if(u.indexOf("/assets/")<0)return;try{if(Date.now()-(+sessionStorage.getItem("asset-reload")||0)<1e4)return;sessionStorage.setItem("asset-reload",Date.now())}catch(x){}var r=function(){location.reload()};navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(l){return Promise.all(l.map(function(g){return g.unregister()}))}).then(r,r):r()},true)</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>%BRAND%</title>
    <meta name="description" content="Anotá y repartí los gastos del viaje con tu grupo." />
    <meta property="og:title" content="%BRAND%" />
    <meta property="og:description" content="Anotá y repartí los gastos del viaje con tu grupo." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:image" content="%SITE%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
